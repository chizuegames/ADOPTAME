<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#f7efe9" />

  <title>Adóptame · Modo historia</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <main
    id="app"
    class="app"
    aria-live="polite"
  >

    <div class="stage-shell">

      <!-- MÚSICA -->
      <audio
        id="bgMusic"
        src="Cozy Shelter Days.mp3"
        loop
        preload="auto"
      ></audio>


      <!-- BOTÓN MÚSICA -->
      <button
        id="musicToggle"
        class="music-toggle"
        type="button"
        hidden
        aria-label="Silenciar música"
        title="Silenciar música"
      >
        🔊
      </button>


      <!-- BOTÓN VOLVER -->
      <button
        id="previousButton"
        class="previous-button"
        type="button"
        hidden
        aria-label="Volver a la pantalla anterior"
        title="Volver atrás"
      >
        ←
      </button>


      <!-- ESCENARIO -->
      <section
        id="stage"
        class="stage"
        tabindex="0"
        aria-label="Historia interactiva. Toca o presiona Enter para continuar."
      >

        <!-- IMAGEN -->
        <img
          id="sceneImage"
          class="scene-image"
          src="IMGI.png"
          alt=""
          draggable="false"
        />


        <!-- TOCA PARA INICIAR -->
        <div
          id="startPrompt"
          class="start-prompt"
        >
          Toca para iniciar
        </div>


        <!-- TEXTO DE DIÁLOGO -->
        <div
          id="dialogueText"
          class="dialogue-text"
          hidden
        ></div>


        <!-- RESALTADOS DE LA CARTA DE RANGO -->

        <!-- Nombre -->
        <div
          id="animalNameHighlight"
          class="card-highlight card-highlight-name"
          hidden
        ></div>

        <!-- Personalidad -->
        <div
          id="animalTraitHighlight"
          class="card-highlight card-highlight-trait"
          hidden
        ></div>

        <!-- Necesidades -->
        <div
          id="animalNeedsHighlight"
          class="card-highlight card-highlight-needs"
          hidden
        ></div>

        <!-- Requisitos -->
        <div
          id="animalRequirementsHighlight"
          class="card-highlight card-highlight-requirements"
          hidden
        ></div>


        <!-- FLECHA NARANJA / SALTAR -->
        <button
          id="skipButton"
          class="skip-hotspot"
          type="button"
          hidden
          aria-label="Saltar esta parte"
          title="Saltar esta parte"
        ></button>


        <!-- ZONAS TÁCTILES DE LOS CUARTOS -->
        <div
          id="roomHotspots"
          class="room-hotspots"
          hidden
          aria-label="Cuartos de la fundación"
        >

          <button
            class="room-hotspot room-office"
            data-room="office"
            aria-label="Abrir información de la Oficina o Sala extra"
          ></button>

          <button
            class="room-hotspot room-break"
            data-room="break"
            aria-label="Abrir información de la Sala de receso"
          ></button>

          <button
            class="room-hotspot room-reception"
            data-room="reception"
            aria-label="Abrir información de la Recepción"
          ></button>

          <button
            class="room-hotspot room-stimulation"
            data-room="stimulation"
            aria-label="Abrir información de la Sala de estimulación"
          ></button>

          <button
            class="room-hotspot room-rest"
            data-room="rest"
            aria-label="Abrir información de la Sala de descanso"
          ></button>

          <button
            class="room-hotspot room-vet"
            data-room="vet"
            aria-label="Abrir información del Consultorio veterinario"
          ></button>

        </div>


        <!-- VOLVER DESDE UNA SALA -->
        <button
          id="roomBack"
          class="room-back"
          type="button"
          hidden
        >
          ← Volver
        </button>

      </section>

    </div>

  </main>


  <script src="app.js"></script>
  <script src="threat.js"></script>

</body>
</html>
