<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f47a00" />
  <title>Adóptame · Modo historia</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <section
      id="stage"
      class="stage"
      role="button"
      tabindex="0"
      aria-label="Historia interactiva. Toca o presiona Enter para continuar."
    >
      <img id="sceneImage" class="scene-image" src="IMGI.png" alt="" draggable="false" />

      <div id="startPrompt" class="start-prompt">Toca para iniciar</div>

      <div id="dialogueText" class="dialogue-text" hidden></div>

      <div id="continueHint" class="continue-hint" hidden aria-hidden="true">
        <span>toca para continuar</span>
        <span class="continue-arrow">›</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
